name: soorin_portal
description: اپِ مشتریِ سورین — پرتالِ خدمات و پشتیبانی روی موبایل (نیتیو، سریع).
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo-white.png

# آیکونِ اپ = نشانِ شرکت (کِشتیِ سورین روی زمینهٔ سرمه‌ای).
flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0f2d4d"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21

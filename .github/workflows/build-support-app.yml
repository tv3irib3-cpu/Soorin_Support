name: build-support-app

# APKِ اپِ پشتیبان را می‌سازد و به همان Release پیوست می‌کند.
# با انتشارِ هر Release خودکار اجرا می‌شود؛ با workflow_dispatch هم دستی.
# آدرسِ ثابتِ دانلود:
#   https://github.com/<owner>/<repo>/releases/latest/download/soorin-support.apk

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساختِ APK
        working-directory: mobile/support
        run: |
          set -e
          # اسکلتِ پلتفرمِ اندروید را می‌سازد (lib و pubspecِ ما را بازمی‌گردانیم).
          flutter create --org ir.dpst --project-name soorin_support --platforms=android .
          git checkout -- lib pubspec.yaml

          # مجوزِ اینترنت را به منیفستِ اصلی (نسخهٔ release) اضافه کن.
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          fi

          # file_picker (از راهِ flutter_plugin_android_lifecycle) اپ و ماژولِ خود را
          # ملزم به compileSdk 36 می‌کند؛ flutter create پیش‌فرض 34 می‌گذارد.
          # ۱) compileSdkِ اپ → 36
          appg=android/app/build.gradle.kts
          [ -f "$appg" ] || appg=android/app/build.gradle
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$appg"

          flutter pub get

          # ۲) خودِ ماژولِ file_picker در pub cache هنوز با 34 کامپایل می‌شود (چون از
          #    flutter.compileSdkVersion پیروی می‌کند که 34 است). build.gradle آن را
          #    مستقیم به 36 ببر — قطعی‌ترین راه، مستقل از نوعِ extension.
          for fp in $(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*file_picker*/android/build.gradle' 2>/dev/null); do
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk 36/' "$fp"
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*3[0-9]/compileSdk 36/' "$fp"
            echo "--- patched $fp ---"; grep -n compileSdk "$fp" || true
          done

          # آیکونِ اپ را از نشانِ شرکت بساز (mipmapهای اندروید + آیکونِ adaptive).
          dart run flutter_launcher_icons

          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk soorin-support.apk

      - name: پیوست به Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/support/soorin-support.apk

      - name: آپلود به‌عنوان Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: soorin-support-apk
          path: mobile/support/soorin-support.apk

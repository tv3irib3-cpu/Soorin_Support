name: build-support-app

# APKِ اپِ پشتیبان را می‌سازد و به همان Release پیوست می‌کند.
# با انتشارِ هر Release خودکار اجرا می‌شود؛ با workflow_dispatch هم دستی.
# آدرسِ ثابتِ دانلود:
#   https://github.com/<owner>/<repo>/releases/latest/download/soorin-support.apk

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساختِ APK
        working-directory: mobile/support
        run: |
          set -e
          # اسکلتِ پلتفرمِ اندروید را می‌سازد (lib و pubspecِ ما را بازمی‌گردانیم).
          flutter create --org ir.dpst --project-name soorin_support --platforms=android .
          git checkout -- lib pubspec.yaml

          # مجوزِ اینترنت را به منیفستِ اصلی (نسخهٔ release) اضافه کن.
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          fi

          # برخی پلاگین‌ها (file_picker → flutter_plugin_android_lifecycle) اپ و ماژول‌های
          # خود را ملزم به compileSdk 36 می‌کنند؛ flutter create پیش‌فرض 34 می‌گذارد.
          # ۱) compileSdkِ اپ:
          appg=android/app/build.gradle.kts
          [ -f "$appg" ] || appg=android/app/build.gradle
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$appg"
          # ۲) همهٔ ماژول‌های پلاگین هم با compileSdk 36 کامپایل شوند:
          rootg=android/build.gradle.kts
          if [ -f "$rootg" ]; then
            printf '\nsubprojects {\n    afterEvaluate {\n        val a = extensions.findByName("android")\n        if (a is com.android.build.gradle.BaseExtension) { a.compileSdkVersion(36) }\n    }\n}\n' >> "$rootg"
          else
            rootg=android/build.gradle
            printf '\nsubprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android")) { p.android { compileSdkVersion 36 } }\n    }\n}\n' >> "$rootg"
          fi

          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk soorin-support.apk

      - name: پیوست به Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/support/soorin-support.apk

      - name: آپلود به‌عنوان Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: soorin-support-apk
          path: mobile/support/soorin-support.apk

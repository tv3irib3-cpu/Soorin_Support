name: gen-keystore

# یک‌بار اجرا می‌شود تا یک debug keystoreِ ثابت بسازد. این فایل را در مخزن کامیت
# می‌کنیم و همهٔ بیلدهای APK با همین کلید امضا می‌شوند؛ در نتیجه امضای نسخه‌ها
# یکسان می‌ماند و اندروید اجازهٔ «به‌روزرسانی روی نسخهٔ قبلی» را می‌دهد
# (بدونِ نیاز به حذف و نصبِ دوباره). پارامترها همان مقادیرِ استانداردِ debug اندروید.

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ساختِ keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore debug.keystore -storepass android | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore

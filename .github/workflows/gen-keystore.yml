name: gen-keystore

# یک‌بار اجرا می‌شود تا یک debug keystoreِ ثابت بسازد و آن را در مخزن کامیت کند
# (mobile/debug.keystore). همهٔ بیلدهای APK با همین کلید امضا می‌شوند؛ در نتیجه
# امضای نسخه‌ها یکسان می‌ماند و اندروید اجازهٔ «به‌روزرسانی روی نسخهٔ قبلی» را می‌دهد
# (بدونِ نیاز به حذف و نصبِ دوباره). اگر فایل از قبل باشد، کاری نمی‌کند (تا کلید عوض نشود).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ساخت و کامیتِ keystore
        run: |
          set -e
          if [ -f mobile/debug.keystore ]; then
            echo "keystore از قبل وجود دارد — تغییری داده نمی‌شود."
            exit 0
          fi
          keytool -genkeypair -v -keystore mobile/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore mobile/debug.keystore -storepass android | head -12

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mobile/debug.keystore
          git commit -m "ci: افزودنِ debug keystoreِ ثابت برای امضای یکسانِ APKها"
          git push

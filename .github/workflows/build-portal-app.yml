name: build-portal-app

# APKِ اپِ مشتری را می‌سازد و به همان Release پیوست می‌کند.
# با انتشارِ هر Release خودکار اجرا می‌شود؛ با workflow_dispatch هم دستی.
# آدرسِ ثابتِ دانلود:
#   https://github.com/<owner>/<repo>/releases/latest/download/soorin-portal.apk

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساختِ APK
        working-directory: mobile/portal
        run: |
          set -e
          # اسکلتِ پلتفرمِ اندروید را می‌سازد (lib و pubspecِ ما را بازمی‌گردانیم).
          flutter create --org ir.dpst --project-name soorin_portal --platforms=android .
          git checkout -- lib pubspec.yaml

          # امضای پایدار: keystoreِ ثابتِ مخزن را جای keystoreِ debug بگذار تا امضای
          # همهٔ بیلدها یکی بماند و آپدیت روی نسخهٔ قبلی نصب شود (نه «حذف و نصبِ دوباره»).
          if [ -f ../debug.keystore ]; then
            mkdir -p ~/.android
            cp ../debug.keystore ~/.android/debug.keystore
          fi

          # مجوزِ اینترنت را به منیفستِ اصلی (نسخهٔ release) اضافه کن.
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          fi

          flutter pub get

          # آیکونِ اپ را از نشانِ شرکت بساز (mipmapهای اندروید + آیکونِ adaptive).
          dart run flutter_launcher_icons

          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk soorin-portal.apk

      - name: پیوست به Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/portal/soorin-portal.apk

      - name: آپلود به‌عنوان Artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: soorin-portal-apk
          path: mobile/portal/soorin-portal.apk
